<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoBus | Create account</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="auth.js?v=4"></script>
  <script>GoBusAuth.requireGuest();</script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="login.html"><span class="brand-badge">🚌</span> GoBus</a>
    <section class="auth-card">
      <header class="auth-heading">
        <h1>Create your account</h1>
        <p>Sign up to manage your bus bookings.</p>
      </header>

      <form id="signup-form" class="auth-form">
        <div class="auth-field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>
        </div>
        <div class="auth-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <small>Use at least 8 characters.</small>
        </div>
        <p id="auth-error" class="auth-error" role="alert" hidden></p>
        <button class="btn-primary full-width" type="submit">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>
  <script>
    const form = document.getElementById('signup-form');
    const error = document.getElementById('auth-error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.hidden = true;
      const submit = form.querySelector('button[type="submit"]');
      submit.disabled = true;
      try {
        await GoBusAuth.register({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        window.location.replace('index.html');
      } catch (signupError) {
        error.textContent = signupError.message;
        error.hidden = false;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
