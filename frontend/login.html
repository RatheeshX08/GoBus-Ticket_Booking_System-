<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoBus | Log in</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="auth.js?v=4"></script>
  <script>GoBusAuth.requireGuest();</script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="login.html"><span class="brand-badge">🚌</span> GoBus</a>
    <section class="auth-card">
      <header class="auth-heading">
        <h1>Welcome back</h1>
        <p>Log in to search buses and manage your bookings.</p>
      </header>

      <form id="login-form" class="auth-form">
        <div class="auth-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="auth-error" class="auth-error" role="alert" hidden></p>
        <button class="btn-primary full-width" type="submit">Log in</button>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <button class="btn-secondary full-width demo-login-btn" id="demo-login-btn" type="button">
        Continue with demo account
      </button>
      <p class="demo-credentials">Demo credentials: <strong>demo@gobus.com</strong> / <strong>password123</strong></p>
      <p class="auth-switch">New to GoBus? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const error = document.getElementById('auth-error');

    document.getElementById('demo-login-btn').addEventListener('click', async (event) => {
      error.hidden = true;
      const button = event.currentTarget;
      button.disabled = true;
      try {
        await GoBusAuth.loginDemo();
        window.location.replace(GoBusAuth.getPostLoginUrl());
      } catch (loginError) {
        error.textContent = loginError.message;
        error.hidden = false;
      } finally {
        button.disabled = false;
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.hidden = true;
      const submit = form.querySelector('button[type="submit"]');
      submit.disabled = true;
      try {
        await GoBusAuth.login({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        window.location.replace(GoBusAuth.getPostLoginUrl());
      } catch (loginError) {
        error.textContent = loginError.message;
        error.hidden = false;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
